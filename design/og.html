<!doctype html>
<!--
  The link-preview image, public/og.png (1200 by 630). To make it again after a change:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --screenshot=public/og.png design/og.html
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }
      body {
        position: relative;
        overflow: hidden;
        padding: 72px 80px;
        color: #e6edf5;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background:
          radial-gradient(700px 420px at 86% 4%, rgb(34 211 238 / 0.2), transparent 70%),
          radial-gradient(900px 520px at 8% 0%, rgb(37 99 235 / 0.32), transparent 70%),
          linear-gradient(rgb(148 197 255 / 0.05) 1px, transparent 1px) 0 0 / 100% 42px,
          linear-gradient(90deg, rgb(148 197 255 / 0.05) 1px, transparent 1px) 0 0 / 42px 100%,
          #0a0f1a;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .brand img {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        box-shadow:
          0 0 0 1px rgb(148 197 255 / 0.25),
          0 18px 40px -12px rgb(34 211 238 / 0.5);
      }
      .pill {
        padding: 6px 16px;
        font-size: 20px;
        color: #67e8f9;
        background: #122543;
        border: 1px solid rgb(192 199 209 / 0.22);
        border-radius: 999px;
      }
      h1 {
        margin: 62px 0 22px;
        font-size: 92px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.025em;
        background: linear-gradient(100deg, #60a5fa 0%, #22d3ee 55%, #a5f3fc 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        margin: 0;
        max-width: 900px;
        font-size: 34px;
        line-height: 1.35;
        color: #a3b1c2;
      }
      .asks {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 64px;
        display: flex;
        gap: 14px;
      }
      .asks span {
        padding: 12px 20px;
        font-size: 22px;
        color: #e6edf5;
        white-space: nowrap;
        background: rgb(15 30 54 / 0.9);
        border: 1px solid rgb(192 199 209 / 0.18);
        border-left: 3px solid #22d3ee;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="../public/favicon.svg" alt="" /><span>taiga-mcp</span
      ><span class="pill">Reads · writes if you allow</span>
    </div>
    <h1>Taiga for AI assistants</h1>
    <p>Ask Claude about your projects, sprints, user stories, tasks and issues, in plain words.</p>
    <div class="asks">
      <span>“What is left in this sprint?”</span>
      <span>“Which epics are behind?”</span>
      <span>“What did I finish in October?”</span>
    </div>
  </body>
</html>
