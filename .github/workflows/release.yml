name: Release

# Push a tag such as v0.4.1 (after setting that version in package.json, server.json and
# SERVER_INFO in src/server.ts) to publish it to npm and to the MCP Registry.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance and signing in to the MCP Registry as this repository

jobs:
  publish:
    name: npm and MCP Registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Tag, package.json and server.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const tag = process.argv[1];
            const pkg = require("./package.json").version;
            const srv = require("./server.json");
            const versions = [pkg, srv.version, ...srv.packages.map((p) => p.version)];
            if (versions.some((v) => v !== tag)) {
              console.error(`Tag ${tag} but package.json/server.json say ${versions.join(", ")}`);
              process.exit(1);
            }
          ' "$tag"

      # Skipped when this version is already on npm, so a re-run can finish the registry step.
      # prepublishOnly runs pnpm check (types, lint, format, tests, build) first.
      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm"
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The registry looks the package up on npm, which can take a minute to show a new version.
      - name: Wait until npm serves this version
        run: |
          name="$(node -p 'require("./package.json").name')"
          for i in $(seq 1 30); do
            npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm still does not show $name@${GITHUB_REF_NAME#v}" && exit 1

      - name: Publish to the MCP Registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
