name: Release

# Push a tag such as v0.4.1 (after setting that version in package.json, server.json and
# SERVER_INFO in src/server.ts) to publish it to npm and to the MCP Registry.
on:
  push:
    tags: ['v*']
  # Run by hand to ask npm whether it takes this workflow as the package's trusted publisher.
  # Nothing is published.
  workflow_dispatch:

permissions:
  contents: write # the GitHub Release
  id-token: write # npm trusted publishing and provenance; signing in to the MCP Registry

jobs:
  trusted-publishing:
    name: npm accepts this workflow (nothing is published)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The same trade npm publish makes: a GitHub identity token for a short-lived npm one,
      # which is thrown away here. npm's answer says what does not match when it refuses.
      - name: Trade a GitHub identity token for an npm one
        run: |
          id_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)"
          echo "::add-mask::$id_token"
          status="$(curl -sS -o answer.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $id_token" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@kietdev%2ftaiga-mcp")"
          npm_token="$(jq -r '.token // empty' answer.json 2>/dev/null)"
          [ -n "$npm_token" ] && echo "::add-mask::$npm_token"
          echo "npm answered $status: $(jq -c 'del(.token) | if . == {} then "accepted" else . end' answer.json 2>/dev/null || head -c 300 answer.json)"
          rm -f answer.json
          [ "$status" -lt 300 ]

  publish:
    name: npm and MCP Registry
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (npm checks this workflow's GitHub identity; no token) needs npm 11.5.1
      # or newer, and Node 22 comes with npm 10.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - name: Tag, package.json and server.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e '
            const tag = process.argv[1];
            const pkg = require("./package.json").version;
            const srv = require("./server.json");
            const versions = [pkg, srv.version, ...srv.packages.map((p) => p.version)];
            if (versions.some((v) => v !== tag)) {
              console.error(`Tag ${tag} but package.json/server.json say ${versions.join(", ")}`);
              process.exit(1);
            }
          ' "$tag"

      # Skipped when this version is already on npm, so a re-run can finish the registry step.
      # prepublishOnly runs pnpm check (types, lint, format, tests, build) first.
      - name: Publish to npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          if npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm"
          else
            npm publish --provenance
          fi
        # No token: npm takes this workflow as the package's trusted publisher (set on npmjs.com:
        # kiet0807/taiga-mcp, release.yml) and hands it a short-lived one for this run.

      # The registry looks the package up on npm, which can take a minute to show a new version.
      - name: Wait until npm serves this version
        run: |
          name="$(node -p 'require("./package.json").name')"
          for i in $(seq 1 30); do
            npm view "$name@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "npm still does not show $name@${GITHUB_REF_NAME#v}" && exit 1

      - name: Publish to the MCP Registry
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      # Glama and people watching the repository pick up new versions from GitHub Releases.
      # Skipped when the release exists, so a re-run can finish.
      - name: GitHub Release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
